# Sobe tudo com:  docker compose up --build
#   Front:  http://localhost:8080
#   API:    http://localhost:3333   (health: /health)
#   Banco:  localhost:5433  (postgres / postgres, base "leilao")
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leilao
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d leilao']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgres://postgres:postgres@db:5432/leilao
      # Segredos fixos APENAS para demonstração local. Em produção use valores próprios.
      JWT_SECRET: compose-demo-jwt-secret-change-me
      CHAIN_SECRET: compose-demo-chain-secret-change-me
      CORS_ORIGIN: http://localhost:8080
      AUTO_MIGRATE: 'true'
      AUTO_SEED: 'true'
    ports:
      - '3333:3333'

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:3333
        VITE_SHOW_DEMO: 'true'
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  pgdata:

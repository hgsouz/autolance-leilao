# Blueprint do Render (https://render.com/docs/blueprint-spec): cria banco + API + front.
# Depois do primeiro deploy, ajuste duas variáveis (marcadas com sync: false):
#   - CORS_ORIGIN (no serviço da API): URL pública do front, ex.: https://autolance-web.onrender.com
#   - VITE_API_URL (no site estático): URL pública da API, ex.: https://autolance-api.onrender.com
# e faça um redeploy do front (a URL da API é embutida no build).
databases:
  - name: autolance-db
    plan: free
    databaseName: leilao

services:
  - type: web
    name: autolance-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: autolance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CHAIN_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: AUTO_MIGRATE
        value: 'true'
      - key: AUTO_SEED
        value: 'true'

  - type: web
    name: autolance-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SHOW_DEMO
        value: 'true'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
